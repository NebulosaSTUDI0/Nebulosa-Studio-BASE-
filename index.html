<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebulosa Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="hero">
  <div class="logo" role="img" aria-label="Nebulosa Studio"></div>
  <p class="tag">Estudio independiente de animación</p>
  <button class="next" type="button" aria-label="Continuar" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="8,3 17,12 8,21"/></svg></button>
</main>
<canvas class="art" id="art" aria-hidden="true"></canvas>
<section class="menu" id="menu" aria-hidden="true" aria-label="Menú">
  <button class="opt" type="button" id="optReunion" style="--i:0">Reunión</button>
  <button class="opt" type="button" id="optArte" style="--i:1">Espacio de arte</button>
  <button class="opt" type="button" style="--i:2">Misiones</button>
  <button class="opt" type="button" id="optUsuario" style="--i:3">Usuario</button>
</section>
<section class="menu again" id="meet" aria-hidden="true" aria-label="Reunión">
  <button class="opt" type="button" id="optCrear" style="--i:0">Crear reunión</button>
  <button class="opt" type="button" id="optUnirse" style="--i:1">Unirse</button>
</section>
<section class="menu again gallery" id="arte" aria-hidden="true" aria-label="Espacio de arte">
  <h2 class="vtitle">Espacio de arte</h2>
  <button class="opt" type="button" id="optNuevo" style="--i:0">Crear cuadro</button>
  <p class="lbl" id="gState" style="width:auto"></p>
  <div class="cards" id="cards"></div>
</section>
<section class="menu again" id="nuevo" aria-hidden="true" aria-label="Crear cuadro">
  <h2 class="vtitle">Nuevo cuadro</h2>
  <label class="lbl" for="nbName">Nombre del cuadro</label>
  <input class="code nm" id="nbName" type="text" maxlength="60" autocomplete="off" placeholder="Mi cuadro">
  <p class="lbl" id="nbBy" style="margin:0"></p>
  <button class="opt" type="button" id="optHacer" style="--i:0">Crear y empezar</button>
</section>
<section class="menu again studio" id="lienzo" aria-hidden="true" aria-label="Lienzo del cuadro">
  <canvas id="board" aria-label="Lienzo infinito"></canvas>
  <textarea id="txtEd" spellcheck="false" wrap="off" aria-label="Texto"></textarea>
  <div class="sbar">
    <div class="stitle" id="sTitle"></div>
    <div class="sgrp">
      <button class="ctl icon" type="button" id="bUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l-5 5 5 5M4 11h10a5 5 0 0 1 0 10h-2"/></svg></button>
      <button class="ctl icon" type="button" id="bRedo" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l5 5-5 5M20 11H10a5 5 0 0 0 0 10h2"/></svg></button>
    </div>
    <div class="sgrp">
      <button class="ctl icon" type="button" id="bZout" title="Alejar" aria-label="Alejar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button class="ctl zp" type="button" id="zPct" title="Zoom al 100%">100%</button>
      <button class="ctl icon" type="button" id="bZin" title="Acercar" aria-label="Acercar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
      <button class="ctl icon" type="button" id="bFit" title="Ver todo" aria-label="Ver todo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="sgrp">
      <label class="pf" title="Color de fondo" style="padding:0 .35rem"><input type="color" id="cBg" value="#08080a" aria-label="Color de fondo"></label>
      <button class="ctl icon" type="button" id="bExp" title="Descargar PNG (la selección, o todo)" aria-label="Descargar PNG"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
    </div>
  </div>
  <div class="sprops sgrp" id="sProps">
    <span class="pf" id="pFill" hidden>Color <input type="color" id="cFill" value="#ffffff"><button class="ctl" type="button" id="nFill" title="Sin relleno">Sin</button></span>
    <span class="pf" id="pStroke" hidden><span id="lStroke">Contorno</span> <input type="color" id="cStroke" value="#ffffff"><button class="ctl" type="button" id="nStroke" title="Sin contorno">Sin</button></span>
    <span class="pf" id="pW" hidden>Grosor <input type="range" id="rW" min="0" max="60" value="4"></span>
    <span class="pf" id="pOp" hidden>Opacidad <input type="range" id="rOp" min="5" max="100" value="100"></span>
    <span class="pf" id="pFont" hidden><select id="sFont" aria-label="Tipo de letra"><option value="serif">Serif</option><option value="sans">Sans</option><option value="mono">Mono</option><option value="display">Display</option></select></span>
    <span class="pf" id="pAct" hidden>
      <button class="ctl" type="button" id="bFlip" title="Voltear horizontalmente">Voltear</button>
      <button class="ctl" type="button" id="bFront" title="Traer al frente">Frente</button>
      <button class="ctl" type="button" id="bBack" title="Enviar al fondo">Fondo</button>
      <button class="ctl" type="button" id="bDup" title="Duplicar (Ctrl+D)">Duplicar</button>
      <button class="ctl" type="button" id="bDel" title="Borrar (Supr)">Borrar</button>
    </span>
  </div>
  <div class="sdock sgrp" id="sDock">
    <button class="ctl icon on" type="button" data-tool="select" title="Seleccionar (V)" aria-label="Seleccionar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
    <button class="ctl icon" type="button" data-tool="hand" title="Mover lienzo (H o Espacio)" aria-label="Mover lienzo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    <button class="ctl icon" type="button" data-tool="draw" title="Dibujar (P)" aria-label="Dibujar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/></svg></button>
    <button class="ctl icon" type="button" data-tool="text" title="Texto (T)" aria-label="Texto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button class="ctl icon" type="button" data-tool="rect" title="Rectángulo (R)" aria-label="Rectángulo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14"/></svg></button>
    <button class="ctl icon" type="button" data-tool="ellipse" title="Elipse (O)" aria-label="Elipse"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
    <button class="ctl icon" type="button" id="bImg" title="Añadir imágenes (I). También puedes arrastrarlas o pegarlas con Ctrl+V" aria-label="Añadir imágenes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="1.8"/><path d="M3 18l5-5 4 4 3-3 6 6"/></svg></button>
  </div>
  <input type="file" id="imgPick" accept="image/*" multiple hidden>
</section>
<section class="menu again profile" id="usuario" aria-hidden="true" aria-label="Usuario">
  <h2 class="vtitle">Usuario</h2>
  <div class="upick">
    <button class="uav" type="button" id="uAv" aria-label="Cambiar foto"></button>
    <div class="uph">
      <button class="ctl" type="button" id="uPhoto">Cambiar foto</button>
      <button class="ctl" type="button" id="uNoPhoto">Quitar foto</button>
    </div>
  </div>
  <label class="lbl" for="uName">Tu nombre</label>
  <input class="code nm" id="uName" type="text" maxlength="24" autocomplete="off" placeholder="Tu nombre">
  <p class="lbl ucol" style="margin:0">Tu color <span class="ustar" id="uStar" aria-hidden="true"></span></p>
  <div class="ucolor">
    <canvas class="wheel" id="uWheel" tabindex="0" role="slider" aria-label="Color (flechas para ajustar)"></canvas>
    <div class="vbar" id="uBar" tabindex="0" role="slider" aria-label="Brillo" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="100" title="Brillo"><i></i></div>
  </div>
</section>
<section class="menu again" id="join" aria-hidden="true" aria-label="Unirse a una reunión">
  <label class="lbl" for="codeIn">Código de la reunión</label>
  <input class="code" id="codeIn" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
  <button class="opt" type="button" id="optEntrar" style="--i:0">Entrar</button>
</section>
<section class="menu again room" id="room" aria-hidden="true" aria-label="Reunión en curso">
  <div class="codebar">Código <b id="roomCode"></b><button class="ctl" type="button" id="ctlCopy">Copiar</button></div>
  <div class="stage" id="stage" hidden>
    <div class="stagebox" id="stageBox"><div class="stageframe" id="stageFrame"><video id="stageVid" autoplay muted playsinline hidden></video></div><div class="stnote" id="stNote" hidden></div></div>
    <div class="stagebar">
      <span class="stlbl" id="stLbl"></span>
      <span class="stnav" id="stNav" hidden>
        <button class="ctl icon" type="button" id="stPrev" title="Anterior (←)" aria-label="Imagen anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span id="stCount"></span>
        <button class="ctl icon" type="button" id="stNext" title="Siguiente (→)" aria-label="Imagen siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </span>
      <button class="ctl" type="button" id="stSwap" hidden>Cambiar</button>
      <button class="ctl" type="button" id="stFull">Pantalla completa</button>
      <button class="ctl" type="button" id="stStop" hidden>Dejar de compartir</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button class="ctl icon" type="button" id="ctlMic" title="Silenciar micrófono" aria-label="Silenciar micrófono"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/><path class="slash" d="M4 4l16 16"/></svg></button>
    <button class="ctl icon" type="button" id="ctlShare" title="Compartir imágenes o cuadros" aria-label="Compartir imágenes o cuadros"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13"/><path d="M8 21h8M12 17v4M12 14V8M9.5 10.5L12 8l2.5 2.5"/></svg></button>
  </div>
</section>
<div class="sheet" id="shareSheet" hidden role="dialog" aria-modal="true" aria-label="Compartir en la reunión">
  <div class="sheetin">
    <div class="sheethd"><b>Compartir en la reunión</b><button class="ctl" type="button" id="shClose">Cerrar</button></div>
    <button class="ctl" type="button" id="shImgs">Imágenes de tu dispositivo</button>
    <div class="lbl2">O un cuadro del Espacio de arte (se actualiza en vivo)</div>
    <div class="cards" id="shCards"></div>
    <div class="shstate" id="shState"></div>
    <div id="shWeb">
      <div class="lbl2">O una página web: la abres tú y puedes moverte por ella mientras los demás la ven</div>
      <div class="urlrow" style="margin-top:.6rem"><input id="shUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://ejemplo.com"><button class="ctl" type="button" id="shOpen">1. Abrir enlace</button></div>
      <button class="ctl" type="button" id="shCap" style="margin-top:.5rem;width:100%">2. Elegir esa pestaña para compartir</button>
    </div>
  </div>
</div>
<input type="file" id="sharePick" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
<input type="file" id="filePick" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="back" id="back" type="button" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16,3 7,12 16,21"/></svg></button>
<script src="script.js"></script>
</body>
</html>
