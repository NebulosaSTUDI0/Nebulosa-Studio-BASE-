  --lw:min(88vw,760px);
  --text:#b9b9c0;

  padding-bottom:env(safe-area-inset-bottom,0px);

*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:var(--text)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.hero{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:1.5rem}
.logo{
  position:relative;width:var(--lw);aspect-ratio:1400/445;
  background:var(--logo) center/contain no-repeat;
  filter:drop-shadow(0 0 28px rgba(200,205,255,.10));
  animation:float 9s ease-in-out infinite, rise 2.4s cubic-bezier(.2,.7,.2,1) both;
}
.logo::after{
  content:"";position:absolute;inset:0;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) -150% 0/250% 100% no-repeat;
  mix-blend-mode:plus-lighter;
  animation:sweep 7s ease-in-out 2.2s infinite;
}
.tag{
  margin:0;font-size:clamp(.8rem,2.4vw,1rem);letter-spacing:.08em;text-indent:.08em;text-align:center;transform:translateX(calc(var(--lw) * -.0334));
  max-width:32ch;line-height:1.6;opacity:0;animation:fade 2s ease 2.6s forwards;
}
.next{
  position:fixed;right:calc(1.5rem + env(safe-area-inset-right,0px));bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));
  width:3.8rem;height:3.8rem;display:grid;place-items:center;
  background:none;border:1px solid transparent;border-radius:0;margin:0;padding:0;cursor:pointer;
  line-height:0;
  color:rgba(255,255,255,.22);
  transition:color .3s ease,background-color .3s ease,border-color .3s ease;
  opacity:0;animation:fadeIn 2s ease 3s forwards;
}
.next svg{width:1.5rem;height:1.5rem;display:block;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter}
.next:disabled{cursor:default}
.next:not(:disabled):hover,.next:not(:disabled):focus-visible{color:#000;background-color:#fff;border-color:#fff}
.next:focus-visible{outline:none}
@keyframes fadeIn{to{opacity:1}}
@keyframes leave{to{opacity:0;transform:translateY(-70px) scale(1.04);filter:blur(10px)}}
.going .logo,.going .tag{animation:leave 1.3s cubic-bezier(.5,0,.8,.4) forwards}
.going .logo::after{animation:none}
.going .next{animation:leave .6s ease forwards;pointer-events:none}
.menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1.1rem;padding:1.5rem clamp(1.5rem,9vw,7rem);opacity:0;visibility:hidden;transform:translateY(110px);transition:opacity 1.6s ease,transform 2.2s cubic-bezier(.16,.8,.2,1),visibility 0s 2.2s}
.menu.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.opt{width:min(78vw,22rem);padding:1.05rem 1.2rem;background:none;border:1px solid transparent;border-radius:0;cursor:pointer;font:inherit;font-size:clamp(.95rem,3.4vw,1.15rem);letter-spacing:.12em;text-align:left;color:rgba(255,255,255,.55);opacity:0;transform:translateY(26px);transition:opacity .9s ease calc(.5s + var(--i)*.2s),transform .9s ease calc(.5s + var(--i)*.2s),color .3s ease,background-color .3s ease,border-color .3s ease}
.menu.show .opt{opacity:1;transform:none}
.art{position:absolute;right:-5vw;bottom:0;width:min(80vw,175vh,1500px);aspect-ratio:700/420;z-index:-1;pointer-events:none}
@media (max-width:760px){.art{right:auto;left:0;width:100vw;opacity:.45}}
.opt:hover,.opt:focus-visible{color:#000;background-color:#fff;border-color:#fff;outline:none}
@keyframes rise{from{opacity:0;filter:blur(14px) drop-shadow(0 0 0 transparent)}to{opacity:1}}
@keyframes sweep{0%{background-position:-150% 0}45%,100%{background-position:150% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fade{to{opacity:.8}}
@media (prefers-reduced-motion:reduce){
  .logo,.logo::after,.tag{animation:none}
  .tag{opacity:.8}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="hero">
  <div class="logo" role="img" aria-label="Nebulosa Studio"></div>
  <p class="tag">Estudio independiente de animación</p>
  <button class="next" type="button" aria-label="Continuar" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="8,3 17,12 8,21"/></svg></button>
</main>
<section class="menu" id="menu" aria-hidden="true" aria-label="Menú">
  <canvas class="art" id="art" aria-hidden="true"></canvas>
  <button class="opt" type="button" style="--i:0">Reunión</button>
  <button class="opt" type="button" style="--i:1">Espacio de arte</button>
  <button class="opt" type="button" style="--i:2">Misiones</button>
</section>
<script>
(function(){
  const c=document.getElementById('sky'),x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,dpr,stars=[],mx=0,my=0,tx=0,ty=0;
  let cam=0,camPrev=0,camStart=null,camDist=0,pending=false;const CAM_DUR=4600;
  const ease=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
  function init(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr;
    const n=Math.round(innerWidth*innerHeight/3500);
    stars=Array.from({length:n},()=>({
      x:Math.random()*w,y:Math.random()*h,
      z:Math.random(),r:(Math.random()*1.1+.3)*dpr,
      p:Math.random()*6.28,s:.4+Math.random()*1.2

  function draw(t){
    mx+=(tx-mx)*.04;my+=(ty-my)*.04;
    if(pending){camStart=t;pending=false}
    camPrev=cam;
    if(camStart!==null)cam=camDist*ease(Math.min((t-camStart)/CAM_DUR,1));
    const vy=cam-camPrev;
    x.clearRect(0,0,w,h);
    for(const s of stars){
      const f=.25+.75*s.z;
      const a=.15+.55*s.z*(.6+.4*Math.sin(t/1000*s.s+s.p));
      const px=((s.x+mx*s.z*30*dpr)%w+w)%w;
      const py=((s.y+my*s.z*30*dpr-cam*f)%h+h)%h;
      const r=s.r*(.5+s.z);
      x.globalAlpha=a;x.fillStyle=x.strokeStyle='#e4e6ff';
      const trail=vy*f*3.4;
      if(trail>2){x.lineWidth=r*1.9;x.beginPath();x.moveTo(px,py);x.lineTo(px,py+trail);x.stroke()}
      else{x.beginPath();x.arc(px,py,r,0,6.283);x.fill()}
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
  addEventListener('resize',()=>{init();if(reduce)draw(0)});
  init();requestAnimationFrame(draw);

  const art=document.getElementById('art'),ax=art.getContext('2d');
  let N=0,TX,TY,X,Y,VX,VY,DL,COL,SC;
  let aw=0,ah=0,aimg=null,a32=null,artOn=false,artReady=false,artPending=false,aT0=0,apx=-9,apy=-9;
  const artImg=new Image();
  artImg.onload=()=>{buildDots();artReady=true;if(artPending)startArt()};
  artImg.src=ART;
  function buildDots(){
    const iw=artImg.naturalWidth,ih=artImg.naturalHeight,AR=ih/iw;
    const o=document.createElement('canvas');o.width=iw;o.height=ih;
    const ox=o.getContext('2d');ox.drawImage(artImg,0,0);
    const d=ox.getImageData(0,0,iw,ih).data,n=iw*ih;
    const prob=new Float32Array(n);let sum=0;
    for(let k=0;k<n;k++){
      const v=Math.max(d[k*4],d[k*4+1],d[k*4+2])/255;
      const p=Math.max(0,Math.min(1,(v-.14)/.55));
      prob[k]=p;sum+=p;
    }
    const max=innerWidth<760?22000:85000,q=Math.min(1,max/sum),cap=Math.ceil(max*1.12)+2000;
    TX=new Float32Array(cap);TY=new Float32Array(cap);X=new Float32Array(cap);Y=new Float32Array(cap);
    VX=new Float32Array(cap);VY=new Float32Array(cap);DL=new Float32Array(cap);COL=new Uint32Array(cap);SC=new Float32Array(cap);
    let c=0;
    for(let y=0;y<ih&&c<cap;y++)for(let x=0;x<iw&&c<cap;x++){
      const k=y*iw+x,p=prob[k];
      if(p>0&&Math.random()<p*q){
        let r=d[k*4],g=d[k*4+1],b=d[k*4+2];
        const m=(r+g+b)/3,sat=1.1,gain=.78;
        r=Math.max(0,Math.min(255,(m+(r-m)*sat)*gain|0));
        g=Math.max(0,Math.min(255,(m+(g-m)*sat)*gain|0));
        b=Math.max(0,Math.min(255,(m+(b-m)*sat)*gain|0));
        TX[c]=(x+Math.random())/iw;TY[c]=(y+Math.random())/iw;
        X[c]=Math.random();Y[c]=Math.random()*AR;
        DL[c]=Math.random()*1.6;COL[c]=(r|(g<<8)|(b<<16))>>>0;SC[c]=.75+p*.6;
        c++;
      }
    }
    N=c;
  }
  function sizeArt(){
    const dp=Math.min(devicePixelRatio||1,1.5);
    aw=art.width=Math.round(art.clientWidth*dp);ah=art.height=Math.round(art.clientHeight*dp);
    aimg=ax.createImageData(aw,ah);a32=new Uint32Array(aimg.data.buffer);
  }
  function artFrame(t){
    if(!artOn)return;
    const el=(t-aT0)/1000,sz=aw/1400;
    a32.fill(0);
    for(let i=0;i<N;i++){
      const dl=DL[i];
      if(el<dl)continue;
      let px=X[i],py=Y[i],vx=VX[i],vy=VY[i];
      const dx=TX[i]-px,dy=TY[i]-py,rx=px-apx,ry=py-apy,d2=rx*rx+ry*ry;
      if(d2>=.0049&&dx*dx+dy*dy<1e-9&&vx*vx+vy*vy<1e-10){
        px=TX[i];py=TY[i];X[i]=px;Y[i]=py;VX[i]=0;VY[i]=0;
      }else{
        vx+=dx*.014;vy+=dy*.014;
        if(d2<.0049){const d=Math.sqrt(d2)||1e-4,f=(1-d/.07)*.012;vx+=rx/d*f;vy+=ry/d*f}
        vx*=.87;vy*=.87;px+=vx;py+=vy;
        X[i]=px;Y[i]=py;VX[i]=vx;VY[i]=vy;
      }
      const A=(Math.min(1,(el-dl)*1.5)*150)|0,col=((A<<24)|COL[i])>>>0;
      const s=Math.max(1,Math.round(sz*SC[i])),cx0=(px*aw)|0,cy0=(py*aw)|0;
      for(let yy=0;yy<s;yy++){const row=cy0+yy;if(row<0||row>=ah)continue;
        for(let xx=0;xx<s;xx++){const cx=cx0+xx;if(cx<0||cx>=aw)continue;a32[row*aw+cx]=col}}
    }
    ax.putImageData(aimg,0,0);
    if(!reduce)requestAnimationFrame(artFrame);
  }
  function startArt(){
    if(artOn)return;
    if(!artReady){artPending=true;return}
    sizeArt();artOn=true;aT0=performance.now();
    if(reduce){for(let i=0;i<N;i++){X[i]=TX[i];Y[i]=TY[i];DL[i]=0}aT0=-1e9}
    requestAnimationFrame(artFrame);
  }
  addEventListener('resize',()=>{if(artOn)sizeArt()});

  const btn=document.querySelector('.next'),hero=document.querySelector('.hero'),menu=document.getElementById('menu');
  let started=false;
  setTimeout(()=>{btn.disabled=false},4200);
  function showMenu(){menu.classList.add('show');menu.removeAttribute('aria-hidden');startArt()}
  btn.addEventListener('click',()=>{
    if(started)return;started=true;
    document.body.classList.add('going');
    if(reduce){hero.style.display='none';showMenu();return}
    setTimeout(()=>{camDist=h*3.2;pending=true},1100);
    setTimeout(()=>{hero.style.visibility='hidden'},1800);
    setTimeout(showMenu,4300);
  });
